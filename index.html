<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <title>特邀专属阅读舱</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background: #0d0f12;
      color: #e5e5ea;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .lock-card {
      background: #161a22;
      border: 1px solid #30363d;
      border-radius: 18px;
      padding: 38px 28px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 16px 40px rgba(0,0,0,0.65);
    }
    .seal-icon {
      font-size: 46px;
      margin-bottom: 18px;
      display: inline-block;
      filter: drop-shadow(0 4px 10px rgba(210, 153, 34, 0.3));
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      color: #f2cc60;
      letter-spacing: 1.5px;
      margin-bottom: 8px;
    }
    .subtitle {
      font-size: 13px;
      color: #8b949e;
      margin-bottom: 24px;
      line-height: 1.6;
    }
    .input-group {
      margin-bottom: 20px;
      text-align: left;
    }
    label {
      display: block;
      font-size: 12px;
      color: #8b949e;
      margin-bottom: 8px;
      font-weight: 500;
    }
    input[type="password"] {
      width: 100%;
      padding: 14px 16px;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 10px;
      color: #fff;
      font-size: 18px;
      outline: none;
      letter-spacing: 6px;
      text-align: center;
      transition: all 0.2s;
    }
    input[type="password"]:focus {
      border-color: #f2cc60;
      box-shadow: 0 0 0 3px rgba(242, 204, 96, 0.15);
    }
    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(180deg, #d29922 0%, #b07d18 100%);
      color: #0d0f12;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.2s;
    }
    button:active { transform: scale(0.98); }
    .error-msg {
      margin-top: 14px;
      font-size: 13px;
      color: #f85149;
      display: none;
      line-height: 1.5;
    }
    .footer-note {
      margin-top: 26px;
      font-size: 11px;
      color: #484f58;
      line-height: 1.5;
    }
    .shield-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      color: #7ee787;
      background: rgba(46, 160, 67, 0.1);
      padding: 3px 8px;
      border-radius: 12px;
      margin-bottom: 14px;
    }
    
    /* 永久封禁死锁黑屏 (Permanent Scorched-Earth Screen) */
    .banned-screen {
      background: #08090b;
      border: 2px solid #da3633;
      border-radius: 20px;
      padding: 42px 26px;
      width: 100%;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(218, 54, 51, 0.25);
      animation: alertPulse 2s infinite ease-in-out;
    }
    @keyframes alertPulse {
      0%, 100% { border-color: #da3633; box-shadow: 0 0 25px rgba(218, 54, 51, 0.2); }
      50% { border-color: #f85149; box-shadow: 0 0 45px rgba(218, 54, 51, 0.45); }
    }
    .banned-icon { font-size: 54px; margin-bottom: 16px; display: inline-block; }
    .banned-title { font-size: 21px; font-weight: 800; color: #f85149; letter-spacing: 2px; margin-bottom: 12px; }
    .banned-desc { font-size: 13px; color: #c9d1d9; line-height: 1.7; margin-bottom: 20px; text-align: left; }
    .banned-meta { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 12px; font-size: 12px; color: #8b949e; text-align: left; font-family: ui-monospace, monospace; }
  </style>

  <script>
    // 页面加载第一毫秒立即执行多维封禁检测
    let clientIP = "正在检测...";
    
    function checkPermanentBan() {
      const isBanned = localStorage.getItem('READER_PERMANENT_BANNED') === '1' ||
                       sessionStorage.getItem('READER_PERMANENT_BANNED') === '1' ||
                       document.cookie.indexOf('READER_PERMANENT_BANNED=1') !== -1;
      return isBanned;
    }

    function renderBannedScreen(ip) {
      window.CIPHERTEXT_B64 = null;
      window.SALT_B64 = null;
      window.NONCE_B64 = null;

      document.body.innerHTML = `
        <div class="banned-screen">
          <div class="banned-icon">🚫</div>
          <div class="banned-title">访问被安全系统永久锁死</div>
          <p class="banned-desc">
            系统检测到该终端存在连续多次密码碰撞与暴力试探行为。<br>
            根据作者最高安全军令，<strong>该设备与 IP 访问权限已被永久吊销并物理锁死</strong>，所有访问凭证与解密通道已永久焚毁。
          </p>
          <div class="banned-meta">
            <div>▸ 封禁状态: 永久禁止访问 (PERMANENT BAN)</div>
            <div>▸ 目标 IP: <span style="color:#f85149;">${ip}</span></div>
            <div>▸ 阻断原因: 超过 3 次密码重试触发自毁熔断</div>
            <div>▸ 规则代码: SEC-403-IP-HARDLOCK</div>
          </div>
        </div>
      `;
    }

    if (checkPermanentBan()) {
      document.write('<style>#lock-container { display: none !important; }</style>');
    }

    window.addEventListener('DOMContentLoaded', () => {
      if (checkPermanentBan()) {
        renderBannedScreen(localStorage.getItem('READER_BANNED_IP') || 'Recorded-IP-Node');
      }
    });

    // 预拉取客户端公网 IP
    fetch('https://api.ipify.org?format=json')
      .then(res => res.json())
      .then(data => {
        if (data && data.ip) {
          clientIP = data.ip;
          if (localStorage.getItem('BANNED_IP_' + clientIP) === '1') {
            renderBannedScreen(clientIP);
          }
        }
      })
      .catch(() => {
        fetch('https://ipapi.co/json/')
          .then(res => res.json())
          .then(data => { if (data && data.ip) clientIP = data.ip; })
          .catch(() => { clientIP = "Client-Network-Node"; });
      });
  </script>
</head>

    <h1>特邀专属阅读舱</h1>
    <p class="subtitle">《双面牛马：地府系统我说了算》<br>特邀专属审稿（第 1 ~ 10 章精修稿）</p>
    
    <div class="input-group">
      <label for="pwd">请输入作者授权阅读密码：</label>
      <input type="password" id="pwd" maxlength="12" placeholder="••••" autocomplete="off" autofocus>

  </div>

      const bin = atob(str);

    async function attemptUnlock() {

      const pwd = document.getElementById('pwd').value;

        const dec = new TextDecoder("utf-8");
        const html = dec.decode(decrypted);

        document.open();
        document.write(html);
        document.close();
      } catch (e) {
        failedAttempts++;
        localStorage.setItem('reader_fail_count', failedAttempts);
        btn.disabled = false;
        btn.innerText = "进入阅读舱";

        // 【Boss 铁律：超过 3 次直接永久锁死 IP 与设备，做绝一点！】
        if (failedAttempts >= 3) {
          // 1. 本地多维度锁死
          localStorage.setItem('READER_PERMANENT_BANNED', '1');
          localStorage.setItem('READER_BANNED_IP', clientIP);
          localStorage.setItem('BANNED_IP_' + clientIP, '1');
          sessionStorage.setItem('READER_PERMANENT_BANNED', '1');
          document.cookie = "READER_PERMANENT_BANNED=1; max-age=315360000; path=/; SameSite=Strict";

          // 2. 尝试写入 IndexedDB 做深度锁死
          try {
            const req = indexedDB.open('SEC_SHIELD_DB', 1);
            req.onupgradeneeded = (ev) => {
              ev.target.result.createObjectStore('bans', { keyPath: 'id' });
            };
            req.onsuccess = (ev) => {
              const db = ev.target.result;
              const tx = db.transaction('bans', 'readwrite');
              tx.objectStore('bans').put({ id: 'BAN_STATUS', value: 'PERMANENT', ip: clientIP });
            };
          } catch(e) {}

          // 3. 立即触发永久红黑警报自毁锁屏
          renderBannedScreen(clientIP);
        } else {
          const remaining = 3 - failedAttempts;
          err.innerHTML = `⚠️ 授权密码错误！<br><span style="color:#e3b341; font-weight:700;">仅剩 ${remaining} 次机会，输错即刻永久锁死本设备与IP！</span>`;
          err.style.display = 'block';
        }
      }
    }

    document.getElementById('pwd').addEventListener('keyup', (e) => {
      if (e.key === 'Enter') attemptUnlock();
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <title>特邀专属阅读舱</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background: #0d0f12;
      color: #e5e5ea;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .lock-card {
      background: #161a22;
      border: 1px solid #30363d;
      border-radius: 18px;
      padding: 38px 28px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 16px 40px rgba(0,0,0,0.65);
    }
    .seal-icon {
      font-size: 46px;
      margin-bottom: 18px;
      display: inline-block;
      filter: drop-shadow(0 4px 10px rgba(210, 153, 34, 0.3));
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      color: #f2cc60;
      letter-spacing: 1.5px;
      margin-bottom: 8px;
    }
    .subtitle {
      font-size: 13px;
      color: #8b949e;
      margin-bottom: 24px;
      line-height: 1.6;
    }
    .input-group {
      margin-bottom: 20px;
      text-align: left;
    }
    label {
      display: block;
      font-size: 12px;
      color: #8b949e;
      margin-bottom: 8px;
      font-weight: 500;
    }
    input[type="password"] {
      width: 100%;
      padding: 14px 16px;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 10px;
      color: #fff;
      font-size: 18px;
      outline: none;
      letter-spacing: 6px;
      text-align: center;
      transition: all 0.2s;
    }
    input[type="password"]:focus {
      border-color: #f2cc60;
      box-shadow: 0 0 0 3px rgba(242, 204, 96, 0.15);
    }
    input[type="password"]:disabled {
      background: #1c2128;
      color: #6e7681;
      border-color: #30363d;
    }
    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(180deg, #d29922 0%, #b07d18 100%);
      color: #0d0f12;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.2s;
    }
    button:active { transform: scale(0.98); }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      background: #30363d;
      color: #8b949e;
    }
    .error-msg {
      margin-top: 14px;
      font-size: 13px;
      color: #f85149;
      display: none;
      line-height: 1.5;
    }
    .lock-timer {
      margin-top: 14px;
      font-size: 13px;
      color: #e3b341;
      display: none;
      line-height: 1.5;
    }
    .footer-note {
      margin-top: 26px;
      font-size: 11px;
      color: #484f58;
      line-height: 1.5;
    }
    .shield-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      color: #7ee787;
      background: rgba(46, 160, 67, 0.1);
      padding: 3px 8px;
      border-radius: 12px;
      margin-bottom: 14px;
    }
  </style>
</head>
<body>
  <div class="lock-card" id="lock-container">
    <div class="seal-icon">📜</div>
    <div class="shield-badge">🛡️ 军事级 AES-256 GCM 内存安全加密</div>
    <h1>特邀专属阅读舱</h1>
    <p class="subtitle">《双面牛马：地府系统我说了算》<br>特邀专属审稿（第 1 ~ 10 章精修稿）</p>
    
    <div class="input-group">
      <label for="pwd">请输入作者授权阅读密码：</label>
      <input type="password" id="pwd" maxlength="12" placeholder="••••" autocomplete="off" autofocus>
    </div>
    
    <button id="unlock-btn" onclick="attemptUnlock()">进入阅读舱</button>
    <div class="error-msg" id="err">密码错误，解密失败！请核对后重试</div>
    <div class="lock-timer" id="timer-msg">安全防护已生效，请等待 <span>0</span> 秒后再试</div>
    
    <p class="footer-note">密文采用 PBKDF2 10万次哈希与防穷举熔断机制<br>源码零明文存储 · 全网爬虫屏蔽</p>

4Yz/N0pvNkxSz24uwk5e";
    const NONCE_B64 = "Hsw4ZD7yV5jtsLww";
    const SALT_B64 = "eT8NYU8hfZs2EoRC5rLjsA==";

    // 防暴力破解熔断器 (Anti-Brute-Force Rate Limiting)
    let failedAttempts = parseInt(localStorage.getItem('reader_fail_count') || '0');
    let lockUntil = parseInt(localStorage.getItem('reader_lock_until') || '0');

    function checkLockState() {
      const now = Date.now();
      if (now < lockUntil) {
        const remaining = Math.ceil((lockUntil - now) / 1000);
        document.getElementById('pwd').disabled = true;
        document.getElementById('unlock-btn').disabled = true;
        const timerMsg = document.getElementById('timer-msg');
        timerMsg.style.display = 'block';
        timerMsg.querySelector('span').innerText = remaining;
        document.getElementById('err').style.display = 'none';
        setTimeout(checkLockState, 1000);
        return true;
      } else {
        document.getElementById('pwd').disabled = false;
        document.getElementById('unlock-btn').disabled = false;
        document.getElementById('timer-msg').style.display = 'none';
        return false;
      }
    }
    checkLockState();

    function b64ToUint8(str) {
      const bin = atob(str);
      const arr = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
      return arr;
    }

    async function attemptUnlock() {
      if (checkLockState()) return;

      const pwd = document.getElementById('pwd').value;
      const err = document.getElementById('err');
      const btn = document.getElementById('unlock-btn');
      
      if (!pwd) {
        err.innerText = "请输入作者提供的阅读密码";
        err.style.display = 'block';
        return;
      }

      btn.disabled = true;
      btn.innerText = "正在安全解密中...";
      err.style.display = 'none';

      try {
        const enc = new TextEncoder();
        const pwData = enc.encode(pwd);
        const salt = b64ToUint8(SALT_B64);
        const nonce = b64ToUint8(NONCE_B64);
        const ciphertext = b64ToUint8(CIPHERTEXT_B64);

        // 1. 导入密码生成基础 Key
        const baseKey = await window.crypto.subtle.importKey(
          "raw", pwData, "PBKDF2", false, ["deriveKey"]
        );

        // 2. PBKDF2 强化 100,000 次哈希派生 256 位 AES-GCM 密钥
        const aesKey = await window.crypto.subtle.deriveKey(
          {
            name: "PBKDF2",
            salt: salt,
            iterations: 100000,
            hash: "SHA-256"
          },
          baseKey,
          { name: "AES-GCM", length: 256 },
          false,
          ["decrypt"]
        );

        // 3. 内存解密
        const decrypted = await window.crypto.subtle.decrypt(
          { name: "AES-GCM", iv: nonce },
          aesKey,
          ciphertext
        );

        // 解密成功：清除失败计数，写入 DOM
        localStorage.removeItem('reader_fail_count');
        localStorage.removeItem('reader_lock_until');
        const dec = new TextDecoder("utf-8");
        const html = dec.decode(decrypted);

        document.open();
        document.write(html);
        document.close();
      } catch (e) {
        failedAttempts++;
        localStorage.setItem('reader_fail_count', failedAttempts);
        btn.disabled = false;
        btn.innerText = "进入阅读舱";
        
        // 防暴力破解阶段性熔断机制
        if (failedAttempts >= 5) {
          lockUntil = Date.now() + 300 * 1000; // 锁定 5 分钟
          localStorage.setItem('reader_lock_until', lockUntil);
          checkLockState();
        } else if (failedAttempts >= 3) {
          lockUntil = Date.now() + 30 * 1000; // 锁定 30 秒
          localStorage.setItem('reader_lock_until', lockUntil);
          checkLockState();
        } else {
          err.innerText = "授权密码错误，解密失败！(剩余尝试: " + (3 - failedAttempts) + " 次)";
          err.style.display = 'block';
        }
      }
    }

    document.getElementById('pwd').addEventListener('keyup', (e) => {
      if (e.key === 'Enter') attemptUnlock();
    });
